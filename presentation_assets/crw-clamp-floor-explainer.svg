<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#1E293B"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#DC2626"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#2563EB"/>
    </marker>
    <style>
      .title { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 25px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .panelTitle { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .section { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .body { font: 500 23px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 600 20px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .tiny { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .boldBlue { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #1D4ED8; }
      .boldRed { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #B91C1C; }
      .panel { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 2.5; rx: 28; }
      .panelWarm { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 2.5; rx: 28; }
      .panelCool { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 2.5; rx: 28; }
      .pillRed { fill: #FEE2E2; stroke: #F87171; stroke-width: 2; rx: 12; }
      .pillBlue { fill: #DBEAFE; stroke: #60A5FA; stroke-width: 2; rx: 12; }
      .pillGray { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FCFCFD"/>

  <text x="960" y="90" text-anchor="middle" class="title">How CRW Prevents Distortion</text>
  <text x="960" y="132" text-anchor="middle" class="subtitle">Two safeguards keep personalization honest: clamp and floor.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="190" width="850" height="720" class="panelWarm"/>
    <rect x="990" y="190" width="850" height="720" class="panelCool"/>
  </g>

  <text x="130" y="255" class="panelTitle">1. Clamp = keep a topic inside an allowed range</text>
  <text x="1040" y="255" class="panelTitle">2. Floor = ensure a topic is not erased</text>

  <text x="130" y="310" class="body">User preference can shift a topic up or down,</text>
  <text x="130" y="342" class="body">but it cannot move beyond <tspan class="boldRed">base ± delta</tspan>.</text>

  <text x="1040" y="310" class="body">Very small topics can be compressed,</text>
  <text x="1040" y="342" class="body">but they should not disappear completely.</text>

  <rect x="130" y="390" width="220" height="60" class="pillGray"/>
  <text x="240" y="427" text-anchor="middle" class="section">Example setup</text>
  <text x="130" y="490" class="body">Base proportion = <tspan class="boldRed">15%</tspan></text>
  <text x="130" y="530" class="body">Delta = <tspan class="boldRed">10%</tspan></text>
  <text x="130" y="570" class="body">Allowed range = <tspan class="boldRed">5% to 25%</tspan></text>

  <line x1="420" y1="540" x2="860" y2="540" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="500" y1="514" x2="500" y2="566" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <line x1="640" y1="500" x2="640" y2="580" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="780" y1="514" x2="780" y2="566" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <text x="500" y="610" text-anchor="middle" class="small">5%</text>
  <text x="640" y="485" text-anchor="middle" class="boldRed">Base = 15%</text>
  <text x="780" y="610" text-anchor="middle" class="small">25%</text>
  <text x="640" y="642" text-anchor="middle" class="tiny">allowed band</text>

  <rect x="425" y="676" width="205" height="70" class="pillRed"/>
  <text x="527" y="719" text-anchor="middle" class="body">Raw target = 32%</text>
  <path d="M595 707C675 707 722 676 760 620" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/>
  <text x="700" y="702" class="boldRed">Clamp down to 25%</text>

  <rect x="425" y="772" width="190" height="70" class="pillGray"/>
  <text x="520" y="815" text-anchor="middle" class="body">Raw target = 2%</text>
  <path d="M595 805C675 805 706 770 500 620" stroke="#1E293B" stroke-width="4" fill="none" marker-end="url(#arrowDark)"/>
  <text x="660" y="832" class="small">Clamp up to 5%</text>

  <rect x="1040" y="390" width="220" height="60" class="pillGray"/>
  <text x="1150" y="427" text-anchor="middle" class="section">Example setup</text>
  <text x="1040" y="490" class="body">Base proportion = <tspan class="boldBlue">3%</tspan></text>
  <text x="1040" y="530" class="body">Delta = <tspan class="boldBlue">10%</tspan></text>
  <text x="1040" y="570" class="body">Base - delta = <tspan class="boldBlue">-7%</tspan></text>

  <rect x="1350" y="424" width="370" height="86" class="pillGray"/>
  <text x="1535" y="458" text-anchor="middle" class="section">Without floor</text>
  <text x="1535" y="492" text-anchor="middle" class="body">Lower bound becomes negative</text>

  <text x="1360" y="590" class="body">This would let the topic collapse to zero</text>
  <text x="1360" y="622" class="body">or vanish completely from the summary.</text>

  <line x1="1375" y1="748" x2="1745" y2="748" stroke="#94A3B8" stroke-width="3.5"/>
  <text x="1375" y="780" class="tiny">0%</text>
  <text x="1520" y="780" class="tiny">1%</text>
  <text x="1670" y="780" class="tiny">3%</text>

  <rect x="1438" y="676" width="190" height="70" class="pillBlue"/>
  <text x="1533" y="719" text-anchor="middle" class="body">Floor = 1%</text>
  <path d="M1533 746V704" stroke="#2563EB" stroke-width="4.5" marker-end="url(#arrowBlue)"/>

  <rect x="1360" y="812" width="350" height="70" class="pillBlue"/>
  <text x="1535" y="843" text-anchor="middle" class="section">With floor</text>
  <text x="1535" y="871" text-anchor="middle" class="body">Topic stays present instead of disappearing</text>

  <rect x="190" y="938" width="1540" height="92" rx="24" fill="#0F172A"/>
  <text x="960" y="985" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#F8FAFC">
    Clamp = guardrail. Floor = safety net.
  </text>
  <text x="960" y="1016" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">
    Clamp prevents over-expansion and over-compression. Floor prevents total omission.
  </text>
</svg>
