<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 800 56px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 24px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .body { font: 400 22px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .mono { font: 700 24px Consolas, 'Courier New', monospace; fill: #0F172A; }
      .strong { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .card { fill: #FFFFFF; stroke: #D9E2EC; stroke-width: 2; filter: url(#shadow); }
      .blue { fill: #E8F1FF; stroke: #9CC1FF; stroke-width: 2; }
      .green { fill: #EAFBF1; stroke: #8EE1AF; stroke-width: 2; }
      .red { fill: #FFF0F0; stroke: #F3A4A4; stroke-width: 2; }
      .amber { fill: #FFF8E6; stroke: #F2D07D; stroke-width: 2; }
      .stepnum { font: 800 20px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .pilltext { font: 700 18px 'Segoe UI', Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <text x="120" y="110" class="title">Claim Support Inspired by QAGS</text>
  <text x="120" y="156" class="subtitle">We break the summary into factual claims and check whether transcript evidence supports them.</text>

  <rect x="90" y="220" width="520" height="710" rx="28" class="card"/>
  <text x="130" y="280" class="section">How the Metric Works</text>

  <circle cx="150" cy="350" r="22" fill="#2563EB"/>
  <text x="143" y="358" class="stepnum">1</text>
  <text x="190" y="340" class="strong">Extract factual claims</text>
  <text x="190" y="374" class="body">Break each summary paragraph into concrete factual statements.</text>

  <circle cx="150" cy="465" r="22" fill="#2563EB"/>
  <text x="143" y="473" class="stepnum">2</text>
  <text x="190" y="455" class="strong">Compare with transcript evidence</text>
  <text x="190" y="489" class="body">Link each claim to the most relevant source segments and inspect support.</text>

  <circle cx="150" cy="580" r="22" fill="#2563EB"/>
  <text x="143" y="588" class="stepnum">3</text>
  <text x="190" y="570" class="strong">Label each claim</text>
  <text x="190" y="604" class="body">Mark every claim as either Supported or Unsupported.</text>

  <circle cx="150" cy="695" r="22" fill="#2563EB"/>
  <text x="143" y="703" class="stepnum">4</text>
  <text x="190" y="685" class="strong">Compute precision</text>
  <text x="190" y="719" class="body">Claim support precision = supported claims / total claims.</text>

  <rect x="125" y="780" width="450" height="110" rx="22" class="amber"/>
  <text x="150" y="826" class="strong">Why we use it</text>
  <text x="150" y="860" class="body">It catches unsupported elaboration and gives a more precise grounding check than one overall faithfulness score.</text>

  <rect x="650" y="220" width="770" height="710" rx="28" class="card"/>
  <text x="690" y="280" class="section">Worked Example</text>

  <rect x="700" y="320" width="670" height="125" rx="22" class="amber"/>
  <text x="730" y="365" class="strong">Summary paragraph</text>
  <text x="730" y="403" class="body">“The speaker argues that AI will eliminate most jobs in the next two years.”</text>

  <rect x="720" y="495" width="280" height="120" rx="20" class="green"/>
  <text x="745" y="536" class="strong">Claim 1</text>
  <text x="745" y="574" class="body">AI will eliminate most jobs.</text>

  <rect x="1040" y="495" width="300" height="120" rx="20" class="red"/>
  <text x="1065" y="536" class="strong">Claim 2</text>
  <text x="1065" y="574" class="body">This will happen in two years.</text>

  <line x1="860" y1="445" x2="860" y2="488" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1190" y1="445" x2="1190" y2="488" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="790" y="680" width="490" height="145" rx="22" class="blue"/>
  <text x="820" y="724" class="strong">Transcript evidence</text>
  <text x="820" y="760" class="body">“The speaker discusses major labour disruption from AI, but does not give a specific two-year timeline.”</text>

  <line x1="860" y1="615" x2="930" y2="672" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1190" y1="615" x2="1140" y2="672" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1460" y="220" width="370" height="710" rx="28" class="card"/>
  <text x="1495" y="280" class="section">Output</text>

  <rect x="1495" y="335" width="300" height="86" rx="18" class="green"/>
  <text x="1522" y="370" class="pilltext" fill="#0F5132">Claim 1: Supported</text>
  <text x="1522" y="399" class="small">Broad labour impact is grounded.</text>

  <rect x="1495" y="445" width="300" height="86" rx="18" class="red"/>
  <text x="1522" y="480" class="pilltext" fill="#7F1D1D">Claim 2: Unsupported</text>
  <text x="1522" y="509" class="small">No two-year timeline in evidence.</text>

  <rect x="1495" y="575" width="300" height="120" rx="20" class="amber"/>
  <text x="1520" y="618" class="strong">Claim Support Precision</text>
  <text x="1520" y="664" class="mono">1 / 2 = 50%</text>

  <rect x="1495" y="735" width="300" height="120" rx="20" class="blue"/>
  <text x="1520" y="776" class="strong">Interpretation</text>
  <text x="1520" y="812" class="body">Higher precision means more of the summary’s factual content is grounded in the transcript.</text>

  <rect x="90" y="960" width="1740" height="80" rx="22" fill="#0F172A"/>
  <text x="130" y="1009" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">QAGS-inspired, not paper-faithful:</text>
  <text x="505" y="1009" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#E2E8F0">our implementation uses claim-level support verification rather than the original QA-answer comparison pipeline.</text>
</svg>
